<!DOCTYPE html>
<html lang="uk">
<body style="margin:0; padding:0; background-color:#f5f5f5; font-family:Arial, sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0" style="padding:60px 0; background:#f5f5f5;">
  <tr>
    <td align="center">

      <!-- CARD -->
      <table width="520" cellpadding="0" cellspacing="0" style="background:#ffffff; padding:60px 60px 50px; border-radius:6px;">

        <!-- TITLE -->
        <tr>
          <td align="center" style="padding-bottom:15px;">
            <p style="margin:0; font-size:28px; font-weight:600; color:#111111;">
              Забули пароль?
            </p>
          </td>
        </tr>

        <!-- SUBTITLE -->
        <tr>
          <td align="center" style="padding-bottom:40px;">
            <p style="margin:0; font-size:15px; color:#6b7280; line-height:22px;">
              Ви отримали цей лист, тому що подали запит на відновлення пароля.<br>
              Натисніть кнопку нижче, щоб створити новий пароль.
            </p>
          </td>
        </tr>

        <!-- BUTTON -->
        <tr>
          <td align="center" style="padding-bottom:40px;">
            <table cellpadding="0" cellspacing="0">
              <tr>
                <td align="center" bgcolor="#e5e7eb" style="border-radius:8px;">
                  <a href="action_url"
                     style="
                       display:inline-block;
                       padding:14px 40px;
                       font-size:15px;
                       color:#111111;
                       text-decoration:none;
                       font-weight:500;
                       font-family:Arial, sans-serif;
                     ">
                    Скинути пароль
                  </a>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- LINK UNDER -->
        <tr>
          <td align="center" style="padding-bottom:30px;">
            <a href="action_url"
               style="
                 font-size:14px;
                 color:#6b7280;
                 text-decoration:underline;
               ">
              Спробувати інший спосіб
            </a>
          </td>
        </tr>

        <!-- DIVIDER -->
        <tr>
          <td>
            <hr style="border:0; border-top:1px solid #eeeeee;">
          </td>
        </tr>

        <!-- FOOTER -->
        <tr>
          <td align="center" style="padding-top:25px;">
            <p style="margin:0; font-size:13px; color:#9ca3af; line-height:20px;">
              Якщо ви не надсилали запит на відновлення пароля — просто проігноруйте цей лист.
            </p>
          </td>
        </tr>
        <tr>
          <td align="center" style="color:#a1a1a1; font-size:12px; padding-bottom:35px;">
            © 2025 OLX.ua — сервіс оголошень №1
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>

</body>
</html>
