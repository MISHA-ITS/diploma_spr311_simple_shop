<!DOCTYPE html>
<html lang="uk">
<body style="margin:0; padding:0; background-color:#f2f3f5; font-family:Arial, sans-serif;">

    <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f2f3f5; padding:30px 0;">
        <tr>
            <td align="center">

                <!-- CARD -->
                <table width="600" cellpadding="0" cellspacing="0"
                       style="background:#ffffff; border-radius:8px; padding:0;">

                    <!-- LOGO -->
                    <tr>
                        <td align="center" style="padding:35px 0 25px;">
                            <span style="font-size:32px; font-weight:bold; color:#002F34;">
                                OLX<span style="color:#23A455;">.UA</span>
                            </span>
                        </td>
                    </tr>

                    <!-- TITLE -->
                    <tr>
                        <td align="center" style="padding:0 40px;">
                            <p style="color:#002F34; margin:0; font-size:22px; font-weight:bold;">
                                Підтвердження електронної пошти
                            </p>
                        </td>
                    </tr>

                    <!-- TEXT -->
                    <tr>
                        <td align="center" style="padding:15px 40px 25px; color:#4b4b4b; font-size:16px; line-height:24px;">
                            Щоб завершити реєстрацію на OLX, будь ласка,
                            підтвердіть вашу електронну адресу.
                            Натисніть кнопку нижче.
                        </td>
                    </tr>

                    <!-- BUTTON (inside table = correct for Gmail) -->
                    <tr>
                        <td align="center" style="padding-bottom:20px;">
                            <table cellpadding="0" cellspacing="0">
                                <tr>
                                    <td align="center" bgcolor="#23A455"
                                        style="border-radius:6px;">
                                        <a href="action_url"
                                           style="
                                            display:inline-block;
                                            padding:14px 32px;
                                            font-size:16px;
                                            color:#ffffff;
                                            text-decoration:none;
                                            font-weight:bold;
                                            font-family:Arial, sans-serif;
                                            ">
                                            Підтвердити Email
                                        </a>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- DIVIDER -->
                    <tr>
                        <td style="padding:10px 40px 0;">
                            <hr style="border:0; border-top:1px solid #e4e4e4;">
                        </td>
                    </tr>

                    <!-- FOOTER -->
                    <tr>
                        <td align="center" style="color:#7a7a7a; font-size:14px; padding:20px 40px 5px;">
                            Якщо ви не надсилали запит на реєстрацію — просто ігноруйте цей лист.
                        </td>
                    </tr>

                    <tr>
                        <td align="center" style="color:#a1a1a1; font-size:12px; padding-bottom:35px;">
                            © 2026 SELLIX — сервіс оголошень №1
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>

</body>
</html>
